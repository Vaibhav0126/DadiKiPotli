name: Daily Short

# Posts one Hindi story Short to YouTube every day at 13:30 UTC (19:00 IST, the
# evening peak). Keep in step with src/schedule.py (PUBLISH_HOUR_UTC/MINUTE_UTC).
on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      idea:
        description: "Optional story idea (otherwise Gemini invents a fresh one)"
        required: false
        type: string
      no_motion:
        description: "Skip paid image-to-video (Ken Burns only)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      YOUTUBE_CLIENT_SECRETS: secrets/youtube_client_secret.json
      YOUTUBE_TOKEN_PATH: secrets/youtube_token.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Write YouTube OAuth files
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          mkdir -p secrets
          if [ -z "$YOUTUBE_TOKEN_JSON" ]; then
            echo "Missing GitHub secret YOUTUBE_TOKEN_JSON"
            echo "Paste the full contents of secrets/youtube_token.json"
            echo "(create it locally with: python -m tools.auth_youtube)."
            exit 1
          fi
          python - <<'PY'
          import os
          from pathlib import Path

          Path("secrets/youtube_token.json").write_text(
              os.environ["YOUTUBE_TOKEN_JSON"], encoding="utf-8"
          )
          client = os.environ.get("YOUTUBE_CLIENT_SECRET_JSON", "").strip()
          if client:
              Path("secrets/youtube_client_secret.json").write_text(
                  client, encoding="utf-8"
              )
          print("Wrote YouTube OAuth files")
          PY

      - name: Preflight
        run: python -m src.main --check

      - name: Render and publish
        env:
          IDEA_OVERRIDE: ${{ inputs.idea }}
          # Scheduled runs have no inputs; default to Ken Burns (no FAL spend).
          SKIP_MOTION: ${{ inputs.no_motion == false && '0' || '1' }}
        run: |
          ARGS=()
          if [ "$SKIP_MOTION" = "1" ]; then
            ARGS+=(--no-motion)
          fi
          if [ -n "$IDEA_OVERRIDE" ]; then
            ARGS+=(--idea "$IDEA_OVERRIDE")
          fi
          python -m tools.daily_post "${ARGS[@]}"

      - name: Commit idea queue and performance updates
        run: |
          # data/uploads.json holds each upload's plan and its latest view counts,
          # which the next run reads to weight its choices. It may not exist yet
          # on the first run, so stage it only when present.
          git add ideas.txt ideas_used.txt
          if [ -f data/uploads.json ]; then git add data/uploads.json; fi
          if git diff --cached --quiet; then
            echo "No queue or performance changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: record daily posted idea"
          git push

story:
  # Tried in order; the first one this key can reach is used and remembered.
  # Google retires model IDs fairly aggressively, so this is a list rather than
  # a single name.
  models:
    - gemini-3.5-flash
    - gemini-3-flash
    - gemini-3.1-flash-lite
    - gemini-2.0-flash
    - gemini-flash-latest
  scene_count: 8
  # Trimmed from 90 so the reel lands near 30s: a short gets more replays and
  # holds attention better than a long one, and this cuts ~25% of the runtime.
  max_hindi_words: 72
  # Regenerate the script if narration falls outside this window.
  min_duration_s: 22.0
  max_duration_s: 34.0
  max_script_retries: 2
  # Prepended to every image prompt. Keep it front-loaded and concrete:
  # trailing style words get ignored, and vague ones ("beautiful", "detailed")
  # pull the model toward generic painterly output.
  art_style: >-
    flat 2D vector cartoon illustration, Amar Chitra Katha Indian comic book
    art, bold black outlines, flat cel shading, no gradients, bright saturated
    colors, simple shapes, storybook illustration

audio:
  provider: gemini # gemini (with edge-tts fallback) | edge
  models:
    - gemini-3.1-flash-tts-preview
    - gemini-2.5-flash-preview-tts
    - gemini-2.5-pro-preview-tts
  # Friendly storyteller. Try Sulafat (warm), Achernar (soft), Kore (firm).
  voice: Achird
  language_code: hi
  # Director's note for Gemini TTS. Describes delivery, not content.
  # Speed is set by style_prompt (brisk) and tempo (below): Gemini TTS has no rate control.
  style_prompt: >-
    Narrate like a lively dadi or kahani-wali telling a story to children:
    brisk, energetic and expressive, never robotic. Keep a quick pace with
    only short pauses between phrases. Sound amused in the funny moments. Drop your voice
    slightly with suspense just before the twist, then sharpen and lift it for
    the twist line. Give each character a tone of their own: an emperor sounds
    grand, a clever minister sounds dry and sly, a frightened victim sounds
    anxious. Recite exactly:
  # Used automatically when Gemini TTS fails (quota / context window).
  fallback_voice: hi-IN-SwaraNeural # female; hi-IN-MadhurNeural for male
  fallback_rate: "+20%"
  fallback_pitch: "+0Hz"
  # Playback speed-up applied to each line's audio (pitch preserved, via atempo).
  # 1.10 is about 10% faster: noticeable, still natural.
  tempo: 1.10
  # Each spoken line is its own Gemini call, so each can have its own voice.
  # Narration uses `voice`. Dialogue uses `character_voices[name]`, falling back
  # to `dialogue_voice`. If Gemini rejects a dialogue voice, that line falls back
  # to the narrator voice and a warning is logged.
  dialogue_voice: Puck
  character_voices: {}
  # Silence between two lines of the same scene, and after each scene.
  line_gap_s: 0.12
  scene_gap_s: 0.15

images:
  # cloudflare = free Workers AI (10k neurons/day). pollinations = fallback.
  provider: cloudflare
  # Cloudflare model id (without the @cf/ prefix).
  # flux-2-klein-4b supports true 9:16 via multipart + optional ref images.
  model: black-forest-labs/flux-2-klein-4b
  # Pollinations-only fallback when provider is pollinations and no token.
  anonymous_model: dreamshaper
  # Reliable free-tier 9:16 size for klein. Composer scales to 1080x1920.
  width: 768
  height: 1344
  min_request_interval_s: 0.5
  max_retries: 4

motion:
  # Off on purpose: fal.ai is paid and this channel runs on free tiers only.
  # Ken Burns carries every scene. Set true only if you deliberately accept spend.
  enabled: false
  provider: fal # fal | none
  model: fal-ai/wan-25-preview/image-to-video
  resolution: 480p
  clip_seconds: 5
  # Only the N highest-impact scenes get animated; the rest use Ken Burns.
  hero_scene_count: 4
  usd_per_second: 0.05
  max_cost_usd: 1.20
  poll_interval_s: 3.0
  timeout_s: 420

video:
  width: 1080
  height: 1920
  fps: 30
  # Any ffmpeg xfade name, or "none" for a hard cut. Quick slides keep the
  # pace up; anything over ~0.15s reads as sluggish in a Short.
  transition: slideleft
  transition_s: 0.12

captions:
  font_file: assets/fonts/Poppins-Bold.ttf
  font_name: Poppins
  font_size: 100
  # Fraction of frame height for the caption baseline. 0.5 keeps text clear
  # of the Shorts UI at the bottom and the title area at the top.
  vertical_position: 0.56
  max_words_per_group: 4
  max_group_duration_s: 2.2
  primary_colour: "&H00FFFFFF&" # white  (ASS is &HAABBGGRR&)
  highlight_colour: "&H0000E5FF&" # amber
  outline_colour: "&H00000000&"
  outline: 5
  shadow: 2
  uppercase: true

music:
  enabled: true
  directory: assets/music
  # Looped under the voice until the video ends; ducked while narration plays.
  volume_db: -25
  duck_db: -8

publish:
  brand_name: Hindi Stories
  # short = YouTube Shorts (#Shorts). long = standard landscape upload.
  format: short
  youtube:
    privacy: public # public | unlisted | private
    category_id: "24" # Entertainment
    default_tags:
      - Shorts
      - HindiStories
      - AkbarBirbal
      - TenaliRaman
      - moralstories
